name: 🐛 Bug Report
description: Report an error or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting an issue, please make sure you have read the documentation: [Getting Started (English)](https://github.com/harry0703/VietNamNewsVideo/blob/main/README-en.md) or [README](https://github.com/harry0703/VietNamNewsVideo/blob/main/README.md).**
        
  - type: textarea
    attributes:
      label: Current Behavior
      description: |
        Describe the issue you are experiencing
      placeholder: |
        When I perform..., the program shows...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        Describe in detail how to reproduce this issue
      placeholder: |
        1. Open...
        2. Click on...
        3. Error occurs...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error Logs
      description: |
        Please provide any error messages or logs (be careful not to include sensitive information)
      placeholder: |
        Error messages, logs, or screenshots...
    validations:
      required: true
  - type: input
    attributes:
      label: Python Version
      description: |
        The Python version you are using
      placeholder: v3.11.0, v3.10.0, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Operating System
      description: |
        Your operating system information
      placeholder: macOS 14.1, Windows 11, Ubuntu 22.04, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: |
        The version of VietNamNewsVideo you are using
      placeholder: v1.0.0, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Information
      description: |
        Any other information that might help solve the issue (screenshots, videos, etc.)
    validations:
      required: false